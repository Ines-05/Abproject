[project]
name = "vision-api"
version = "0.1.0"
description = "Shelf product detection API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "ultralytics>=8.4.120",
    "uvicorn[standard]>=0.52.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
